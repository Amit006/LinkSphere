name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Quality Gate ────────────────────────────────────────────────────────
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --workspace=packages/core

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # ─── Deploy to Dev (on develop branch push) ───────────────────────────────
  deploy-dev:
    name: Deploy → dev
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run DB migrations
        run: npm run db:migrate
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Deploy API to Lambda (dev)
        run: npm run deploy:dev
        working-directory: apps/api
        env:
          STAGE: dev

      - name: Deploy Web to Vercel (dev)
        run: npx vercel --token=${{ secrets.VERCEL_TOKEN }} --env=preview

  # ─── Deploy to Production (on main branch push) ───────────────────────────
  deploy-prod:
    name: Deploy → production
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production   # Requires manual approval in GitHub
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run DB migrations (prod)
        run: npm run db:migrate
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Deploy API to Lambda (prod)
        run: npm run deploy:prod
        working-directory: apps/api

      - name: Deploy Web to Vercel (prod)
        run: npx vercel --token=${{ secrets.VERCEL_TOKEN }} --prod
