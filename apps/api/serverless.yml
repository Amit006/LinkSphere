service: linksphere-api

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'eu-north-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 29
  logRetentionInDays: 14

  environment:
    NODE_ENV: ${self:provider.stage}
    DYNAMODB_TABLE_URLS: ${self:service}-urls-${self:provider.stage}
    DYNAMODB_TABLE_COUNTERS: ${self:service}-counters-${self:provider.stage}
    REDIS_URL: ${ssm(eu-north-1):/linksphere/${self:provider.stage}/redis-url}
    DATABASE_URL: ${ssm(eu-north-1):/linksphere/${self:provider.stage}/database-url}
    BASE_URL: ${ssm(eu-north-1):/linksphere/${self:provider.stage}/base-url}
    JWT_SECRET: ${ssm(eu-north-1):/linksphere/${self:provider.stage}/jwt-secret}
    PRISMA_QUERY_ENGINE_LIBRARY: /var/task/src/libquery_engine-rhel-openssl-3.0.x.so.node

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-*-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-*-${self:provider.stage}/index/*

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    external:
      - '@aws-sdk/client-dynamodb'
      - '@aws-sdk/lib-dynamodb'
    alias:
      '@linksphere/core': '../../packages/core/dist/index.js'

# Copy Prisma Linux binary into the deployment package
package:
  patterns:
    - 'src/libquery_engine-rhel-openssl-3.0.x.so.node'

functions:
  shorten:
    handler: src/functions/shorten.handler
    events:
      - http:
          path: /api/shorten
          method: post
          cors: true

  redirect:
    handler: src/functions/redirect.handler
    memorySize: 1024
    timeout: 29
    events:
      - http:
          path: /{code}
          method: get
          cors: false

  analytics:
    handler: src/functions/analytics.handler
    timeout: 29
    events:
      - http:
          path: /api/analytics/{code}
          method: get
          cors: true

  listUrls:
    handler: src/functions/list-urls.listHandler
    events:
      - http:
          path: /api/urls
          method: get
          cors: true

  deleteUrl:
    handler: src/functions/delete-url.handler
    events:
      - http:
          path: /api/urls/{code}
          method: delete
          cors: true

resources:
  Resources:
    UrlsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-urls-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: shortCode
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: shortCode
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: userId-createdAt-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    CountersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:service}-counters-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: counterName
            AttributeType: S
        KeySchema:
          - AttributeName: counterName
            KeyType: HASH