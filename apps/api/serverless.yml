service: linksphere-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'ap-south-1'}   # Mumbai — closest to Hyderabad
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14

  # All Lambda functions get these env vars
  environment:
    NODE_ENV: ${self:provider.stage}
    DYNAMODB_TABLE_URLS: ${self:service}-urls-${self:provider.stage}
    DYNAMODB_TABLE_COUNTERS: ${self:service}-counters-${self:provider.stage}
    REDIS_URL: ${ssm:/linksphere/${self:provider.stage}/redis-url}
    DATABASE_URL: ${ssm:/linksphere/${self:provider.stage}/database-url}
    BASE_URL: ${ssm:/linksphere/${self:provider.stage}/base-url}
    JWT_SECRET: ${ssm:/linksphere/${self:provider.stage}/jwt-secret}

  # IAM permissions for Lambda execution role
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-*-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-*-${self:provider.stage}/index/*

# ─── Lambda Functions ──────────────────────────────────────────────────────

functions:

  # POST /api/shorten
  shorten:
    handler: src/functions/shorten.handler
    description: Accept a long URL and return a short code
    events:
      - http:
          path: /api/shorten
          method: post
          cors: true

  # GET /{code} — the redirect function (most called, needs to be FAST)
  redirect:
    handler: src/functions/redirect.handler
    description: Redirect short code to original URL
    memorySize: 512   # More memory = more CPU = faster cold starts
    timeout: 5
    events:
      - http:
          path: /{code}
          method: get
          cors: false

  # GET /api/analytics/{code}
  analytics:
    handler: src/functions/analytics.handler
    description: Return click analytics for a short code
    events:
      - http:
          path: /api/analytics/{code}
          method: get
          cors: true

  # GET /api/urls — list user's URLs (requires auth)
  listUrls:
    handler: src/functions/list-urls.handler
    description: List all URLs created by the authenticated user
    events:
      - http:
          path: /api/urls
          method: get
          cors: true

  # DELETE /api/urls/{code}
  deleteUrl:
    handler: src/functions/delete-url.handler
    description: Deactivate a shortened URL
    events:
      - http:
          path: /api/urls/{code}
          method: delete
          cors: true

# ─── DynamoDB Tables ──────────────────────────────────────────────────────

resources:
  Resources:
    # Main URL mapping table
    UrlsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-urls-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST  # No capacity planning needed
        TableClass: STANDARD
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: shortCode
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: shortCode
            KeyType: HASH
        GlobalSecondaryIndexes:
          # Query all URLs by a user, sorted by creation time
          - IndexName: userId-createdAt-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true  # Auto-delete expired URLs

    # Atomic counter table for Base62 ID generation
    CountersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-counters-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: counterName
            AttributeType: S
        KeySchema:
          - AttributeName: counterName
            KeyType: HASH

plugins:
  - serverless-webpack

custom:
  webpack:
    webpackConfig: webpack.config.js
    includeModules:
      forceExclude:
        - aws-sdk
    packager: npm
